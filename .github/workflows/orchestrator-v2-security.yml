name: orchestrator-v2-security
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ORCHESTRATOR_V2.md'
      - 'AUTONOMOUS_DEVELOPMENT.md'
      - 'DEVELOPMENT_GUIDE.md'
      - 'PROJECT_STATE.md'
      - 'DELIVERY_ROADMAP.md'
      - 'PRODUCT_UX.md'
      - 'HARDWARE_E2E.md'
      - 'features/orchestrator_v2_security.feature'
      - 'tools/orchestrator_*.py'
      - 'tools/check_orchestrator_security.py'
      - 'tools/check_agentic_workflow_integrity.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  p0-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run orchestrator security tests
        run: |
          python tools/check_orchestrator_security.py
