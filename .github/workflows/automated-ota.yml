name: FPV Uhyliant Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 2.0.10
        type: string
      channel:
        description: OTA channel
        required: true
        default: test
        type: choice
        options: [test, stable, development]
      notes:
        description: Release notes
        required: true
        default: Hotfix packaged Qt Multimedia startup
        type: string
      prerelease:
        description: Publish as pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

env:
  VERSION: ${{ inputs.version }}
  CHANNEL: ${{ inputs.channel }}
  NOTES: ${{ inputs.notes }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $meta = Get-Content VERSION.json -Raw | ConvertFrom-Json
          if ($meta.version -ne $env:VERSION) { throw 'VERSION.json mismatch' }
          python -c "from pathlib import Path;ns={};exec(Path('src/app/version.py').read_text(encoding='utf-8'),ns);assert ns['VERSION']=='$env:VERSION'"
          $existingTag = git tag -l "v$env:VERSION"
          if ($existingTag) { throw "Tag already exists" }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install pyinstaller pillow
      - name: Prepare assets
        shell: pwsh
        run: |
          python tools/build_icon.py
          New-Item -ItemType Directory -Force src\app\security | Out-Null
          New-Item -ItemType Directory -Force bootstrap-output | Out-Null
          Copy-Item test\release-public-key.pem src\app\security\production-v1-public.pem -Force
          Copy-Item assets\fpv-uhyliant.ico src\app\fpv-uhyliant.ico -Force
      - name: Build binaries
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name FPV-Uhyliant --icon assets/fpv-uhyliant.ico --paths src/app --add-data "src/app/Main.qml;." --add-data "src/app/preview.jpg;." --add-data "src/app/fpv-uhyliant.ico;." --add-data "src/app/security;security" --hidden-import PySide6.QtQml --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --hidden-import PySide6.QtMultimedia --collect-all PySide6.QtMultimedia --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtPdf --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtNfc --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest src/app/main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name FPV-Uhyliant-Launcher --icon assets/fpv-uhyliant.ico src/launcher.py
          pyinstaller --noconfirm --clean --onefile --windowed --name FPV-Uhyliant-Update --icon assets/fpv-uhyliant.ico src/update_helper.py
          Copy-Item dist\FPV-Uhyliant-Launcher.exe bootstrap-output\ -Force
          Copy-Item dist\FPV-Uhyliant-Update.exe bootstrap-output\ -Force
      - name: Packaged GUI QML smoke-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\FPV-Uhyliant\FPV-Uhyliant.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; throw 'Packaged GUI smoke-test timed out' }
          if ($p.ExitCode -ne 0) { throw "Packaged GUI smoke-test failed with exit code $($p.ExitCode)" }
      - name: Package OTA and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          New-Item -ItemType Directory -Force installer-output | Out-Null
          $pkg = "FPV-Uhyliant-v$env:VERSION-Test-UA-Windows.zip"
          Compress-Archive -Path dist\FPV-Uhyliant\* -DestinationPath "release-output\$pkg" -CompressionLevel Optimal
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" packaging\FPV-Uhyliant.iss
          if (-not (Test-Path "installer-output\FPV-Uhyliant-Setup-$env:VERSION.exe")) { throw 'Installer not found' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ inputs.version }}
          path: |
            release-output/*.zip
            installer-output/*.exe
          if-no-files-found: error
