name: automated-signed-ota

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2.0.3
        required: true
        default: 2.0.3
        type: string
      channel:
        description: OTA channel
        required: true
        default: test
        type: choice
        options: [test, stable, development]
      notes:
        description: Release notes
        required: true
        type: string
      prerelease:
        description: Publish as pre-release
        required: true
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate version source
        shell: bash
        env: {VERSION: "${{ inputs.version }}"}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python - "$VERSION" <<'PY'
          import json,pathlib,sys
          expected=sys.argv[1]; ns={}
          exec(pathlib.Path('src/app/version.py').read_text(encoding='utf-8'),ns)
          assert ns['VERSION']==expected
          assert json.loads(pathlib.Path('VERSION.json').read_text(encoding='utf-8'))['version']==expected
          PY
          test "$(git tag -l "v$VERSION")" = ""
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Materialize signing key
        shell: bash
        env: {PRIVATE_KEY: "${{ secrets.FPV_RELEASE_PRIVATE_KEY }}"}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          install -m 700 -d "$RUNNER_TEMP/fpv-signing"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/fpv-signing/private.pem"
          chmod 600 "$RUNNER_TEMP/fpv-signing/private.pem"
      - name: Build OTA package and unsigned manifest
        id: build
        shell: bash
        env:
          VERSION: "${{ inputs.version }}"
          CHANNEL: "${{ inputs.channel }}"
          NOTES: "${{ inputs.notes }}"
        run: |
          set -euo pipefail
          OWNER="$GITHUB_REPOSITORY_OWNER"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_SUFFIX="git""hub"".""io"
          BASE_URL="<scrubbed-url-domain>}"
          RELEASE_DIR="releases/$VERSION"; CHANNEL_DIR="$CHANNEL"
          PACKAGE_NAME="FPV-Uhyliant-v$VERSION-Test-UA-Windows.zip"; PACKAGE_PATH="$RELEASE_DIR/$PACKAGE_NAME"
          mkdir -p "$RELEASE_DIR" "$CHANNEL_DIR/packages"
          (cd src/app && zip -qr "../../$PACKAGE_PATH" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' '*.pyo')
          cp "$PACKAGE_PATH" "$CHANNEL_DIR/packages/$PACKAGE_NAME"
          SHA256="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$PACKAGE_NAME" > "$RELEASE_DIR/SHA256SUMS.txt"
          python - "$CHANNEL_DIR/release.json" "$VERSION" "$CHANNEL" "$PACKAGE_NAME" "$SHA256" "$BASE_URL" "$NOTES" <<'PY'
          import json,sys,urllib.parse
          out,version,channel,package,sha256,base_url,notes=sys.argv[1:]
          package_url=f'{base_url}/{channel}/packages/{package}'
          parsed=urllib.parse.urlparse(package_url)
          if parsed.scheme!='https' or not parsed.hostname or '<' in package_url or '>' in package_url:
              raise SystemExit(f'Invalid package URL: {package_url}')
          manifest={'product':'FPV-Uhyliant','channel':channel,'version':version,'build':int(''.join(version.split('.'))),'mandatory':False,'minimumUpdaterVersion':'2.0.0','package':{'file':package,'url':package_url,'sha256':sha256},'releaseNotes':[notes]}
          with open(out,'w',encoding='utf-8',newline='\n') as f:json.dump(manifest,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
          printf '# FPV Uhyliant %s\n\n%s\n' "$VERSION" "$NOTES" > "$RELEASE_DIR/CHANGELOG.md"
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"; echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"; echo "manifest_path=$CHANNEL_DIR/release.json" >> "$GITHUB_OUTPUT"
      - name: Sign and verify OTA
        shell: bash
        env: {CHANNEL: "${{ inputs.channel }}"}
        run: |
          set -euo pipefail
          python src/release-tools/sign_release.py "${{ steps.build.outputs.manifest_path }}" --key "$RUNNER_TEMP/fpv-signing/private.pem"
          cp "${{ steps.build.outputs.manifest_path }}" "${{ steps.build.outputs.release_dir }}/release.json"
          rm -f "$RUNNER_TEMP/fpv-signing/private.pem"
          python tools/verify_repository.py --channel "$CHANNEL"
          (cd "${{ steps.build.outputs.release_dir }}" && sha256sum -c SHA256SUMS.txt)
      - name: Commit OTA and tag
        shell: bash
        env: {VERSION: "${{ inputs.version }}", CHANNEL: "${{ inputs.channel }}"}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "releases/$VERSION" "$CHANNEL/release.json" "$CHANNEL/packages"
          git commit -m "Publish FPV Uhyliant v$VERSION OTA"
          git tag -a "v$VERSION" -m "FPV Uhyliant v$VERSION OTA"
          git push origin main; git push origin "v$VERSION"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: FPV Uhyliant ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body_path: ${{ steps.build.outputs.release_dir }}/CHANGELOG.md
          files: |
            ${{ steps.build.outputs.package_path }}
            ${{ steps.build.outputs.release_dir }}/SHA256SUMS.txt
            ${{ steps.build.outputs.release_dir }}/release.json
