name: publish-fpv-uhyliant-release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, for example v2.0.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version and release files
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          DIR="releases/${VERSION}"
          ZIP="${DIR}/FPV-Uhyliant-v${VERSION}-Test-UA-Windows.zip"
          if [ ! -d "$DIR" ]; then
            echo "Missing release directory: $DIR" >&2
            exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "Missing release ZIP: $ZIP" >&2
            ls -la "$DIR" || true
            exit 1
          fi
          if [ ! -f "$DIR/SHA256SUMS.txt" ]; then
            echo "Missing SHA256SUMS.txt" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Verify release SHA-256
        shell: bash
        working-directory: ${{ steps.meta.outputs.dir }}
        run: sha256sum -c SHA256SUMS.txt

      - name: Verify no private signing key is committed
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*private*key*' -o -iname '*private*.pem' \) | grep -q .; then
            echo 'Private signing key detected in repository.' >&2
            exit 1
          fi

      - name: Publish or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FPV Uhyliant ${{ steps.meta.outputs.version }} Test
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || true }}
          body_path: ${{ steps.meta.outputs.dir }}/CHANGELOG.md
          files: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.dir }}/SHA256SUMS.txt
