name: build-windows-installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version, for example 2.0.2
        required: true
        default: 2.0.2
        type: string
      publish_release:
        description: Attach installer to GitHub Release vX.Y.Z
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must match X.Y.Z' }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install pyinstaller pillow
      - name: Build icon
        run: python tools/build_icon.py
      - name: Prepare application security assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src\app\security" | Out-Null
          Copy-Item "test\release-public-key.pem" "src\app\security\production-v1-public.pem" -Force
          if (-not (Test-Path "src\app\security\production-v1-public.pem")) {
            throw "Production public key was not prepared"
          }

      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name FPV-Uhyliant --icon assets/fpv-uhyliant.ico --paths src/app --add-data "src/app/Main.qml;." --add-data "src/app/preview.jpg;." --add-data "src/app/security;security" --hidden-import PySide6.QtQml --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 src/app/main.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $p=Start-Process "dist\FPV-Uhyliant\FPV-Uhyliant.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "packaging\FPV-Uhyliant.iss"
      - name: Create portable ZIP and hashes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Compress-Archive -Path "dist\FPV-Uhyliant\*" -DestinationPath "installer-output\FPV-Uhyliant-Portable-$env:VERSION.zip" -CompressionLevel Optimal
          Get-ChildItem "installer-output" -File | Where-Object { $_.Name -ne "SHA256SUMS-Windows.txt" } | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File "installer-output\SHA256SUMS-Windows.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: FPV-Uhyliant-Windows-${{ inputs.version }}
          path: |
            installer-output/*.exe
            installer-output/*.zip
            installer-output/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: |
            installer-output/*.exe
            installer-output/*.zip
            installer-output/SHA256SUMS-Windows.txt
