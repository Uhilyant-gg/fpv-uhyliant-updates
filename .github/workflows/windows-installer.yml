name: build-windows-installer
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 2.0.3
        type: string
      publish_release:
        description: Attach Setup.exe to GitHub Release vX.Y.Z
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve version
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must match X.Y.Z' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Validate version source
        shell: pwsh
        env: {VERSION: "${{ steps.meta.outputs.version }}"}
        run: |
          $meta = Get-Content VERSION.json -Raw | ConvertFrom-Json
          if ($meta.version -ne $env:VERSION) { throw "VERSION.json mismatch: $($meta.version)" }
          python -c "from pathlib import Path;ns={};exec(Path('src/app/version.py').read_text(encoding='utf-8'),ns);assert ns['VERSION']=='$env:VERSION'"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install pyinstaller pillow
      - name: Build icon
        run: python tools/build_icon.py
      - name: Prepare runtime assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src\app\security" | Out-Null
          Copy-Item "test\release-public-key.pem" "src\app\security\production-v1-public.pem" -Force
          Copy-Item "assets\fpv-uhyliant.ico" "src\app\fpv-uhyliant.ico" -Force
      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name FPV-Uhyliant --icon assets/fpv-uhyliant.ico --paths src/app --add-data "src/app/Main.qml;." --add-data "src/app/preview.jpg;." --add-data "src/app/fpv-uhyliant.ico;." --add-data "src/app/security;security" --hidden-import PySide6.QtQml --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineQuick --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.QtBluetooth --exclude-module PySide6.QtNfc --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest src/app/main.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $out = & "dist\FPV-Uhyliant\FPV-Uhyliant.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed: $LASTEXITCODE" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer and hash
        shell: pwsh
        env: {VERSION: "${{ steps.meta.outputs.version }}"}
        run: |
          New-Item -ItemType Directory -Force installer-output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "packaging\FPV-Uhyliant.iss"
          $setup = "installer-output\FPV-Uhyliant-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "Installer not found: $setup" }
          $h = Get-FileHash $setup -Algorithm SHA256
          "$($h.Hash.ToLower())  $($h.Path | Split-Path -Leaf)" | Set-Content "installer-output\SHA256SUMS-Windows.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FPV-Uhyliant-Setup-${{ steps.meta.outputs.version }}
          path: |
            installer-output/FPV-Uhyliant-Setup-${{ steps.meta.outputs.version }}.exe
            installer-output/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - name: Attach Setup to GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          files: |
            installer-output/FPV-Uhyliant-Setup-${{ steps.meta.outputs.version }}.exe
            installer-output/SHA256SUMS-Windows.txt
