name: verify-update-repository
on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
      - 'test/packages/**'
      - 'stable/packages/**'
      - 'development/packages/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
      - name: Install application dependencies
        run: pip install -r src/requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q -f src tools
      - name: Run application self-test
        working-directory: src/app
        run: python main.py --self-test
      - name: Run MAVLink backend self-test
        working-directory: src/app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python main.py --mavlink-self-test
      - name: Load full QML application offscreen
        working-directory: src/app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          marker="$RUNNER_TEMP/fpv-uhyliant-smoke.json"
          python main.py --smoke-test --smoke-marker "$marker"
          python - "$marker" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') != 'ok':
              raise SystemExit(f'invalid smoke marker: {payload}')
          print('QML smoke test: OK')
          PY
      - name: Check project version consistency
        shell: python
        run: |
          import json
          import runpy
          from pathlib import Path
          version = runpy.run_path('src/app/version.py')['VERSION']
          root_version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))['version']
          if version != root_version:
              raise SystemExit(f'version mismatch: src/app/version.py={version}, VERSION.json={root_version}')
      - name: Verify signed test channel when present
        shell: bash
        run: |
          if [ -f test/release.json ]; then
            python tools/verify_repository.py --channel test
          else
            echo "No signed test release yet"
          fi
      - name: Reject committed private keys
        shell: bash
        run: |
          if find . -type f \( -iname '*private*key*' -o -iname '*private*.pem' \) | grep -q .; then
            echo 'Private signing key detected in repository.' >&2
            exit 1
          fi
