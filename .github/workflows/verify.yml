name: verify-update-repository
on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
      - 'test/packages/**'
      - 'stable/packages/**'
      - 'development/packages/**'
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
      - name: Install application dependencies
        run: pip install -r src/requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q -f src tools
      - name: Run application unit tests
        working-directory: src/app
        run: python -m unittest -v test_*.py
      - name: Run tooling unit tests
        working-directory: tools
        run: python -m unittest -v test_*.py
      - name: Run application self-test
        working-directory: src/app
        run: python main.py --self-test
      - name: Run MAVLink backend self-test
        working-directory: src/app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python main.py --mavlink-self-test
      - name: Load full QML application offscreen
        working-directory: src/app
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QT_MEDIA_BACKEND: null
          PULSE_SERVER: /dev/null
        run: |
          marker="$RUNNER_TEMP/fpv-uhyliant-smoke.json"
          python main.py --smoke-test --smoke-marker "$marker"
          python - "$marker" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          if payload.get('status') != 'ok': raise SystemExit(f'invalid smoke marker: {payload}')
          print('QML smoke test: OK')
          PY
      - name: Check project version consistency
        shell: python
        run: |
          import json, runpy
          from pathlib import Path
          version = runpy.run_path('src/app/version.py')['VERSION']
          root_version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))['version']
          if version != root_version: raise SystemExit(f'version mismatch: {version} != {root_version}')
      - name: Verify signed test channel when present
        shell: bash
        run: |
          if [ -f test/release.json ]; then python tools/verify_repository.py --channel test; else echo "No signed test release yet"; fi
      - name: Reject committed private keys and obvious secret artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname '*private*key*' -o -iname '*private*.pem' -o -iname '*.pfx' -o -iname '*.p12' \) | grep -q .; then
            echo 'Private key/certificate artifact detected in repository.' >&2; exit 1
          fi
  windows-pairing-secret-store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install PySide6 for pairing registry
        run: pip install "PySide6>=6.8,<7"
      - name: Compile pairing sources
        run: python -m py_compile src/app/pairing.py src/app/windows_secret_store.py src/app/test_windows_secret_store.py src/app/test_windows_secret_store_integration.py
      - name: Run pairing unit and real Credential Manager integration tests
        working-directory: src/app
        run: python -m unittest -v test_pairing.py test_windows_secret_store.py test_windows_secret_store_integration.py
