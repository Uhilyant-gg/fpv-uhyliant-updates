name: Apply Windows QML startup crash fix
on:
  push:
    branches: [fix/windows-qml-startup-null-callback]
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-qml-startup-null-callback
      - name: Apply startup fix
        run: python tools/apply_windows_qml_startup_fix.py
      - name: Validate patch
        run: |
          python -m py_compile src/app/main.py src/app/test_windows_qml_startup_crash_policy.py
          python -m pytest -q src/app/test_windows_qml_startup_crash_policy.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/main.py src/app/test_windows_qml_startup_crash_policy.py
          git commit -m "Fix Windows QML startup null callback crash"
          git push
