name: Apply Windows QML startup crash fix
on:
  push:
    branches: [fix/windows-qml-startup-null-callback]
permissions:
  contents: write
jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-qml-startup-null-callback
      - name: Apply targeted lifetime and message-handler fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/main.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from PySide6.QtCore import QUrl,QTimer,qInstallMessageHandler', 'from PySide6.QtCore import QUrl,QTimer')
          old = "harness.mark('qgui-application-begin');qInstallMessageHandler(qt_message);app=QGuiApplication(sys.argv);app.setApplicationName('FPV-Uhyliant');app.setApplicationVersion(VERSION);harness.mark('qgui-application-complete')"
          new = "harness.mark('qgui-application-begin');app=QGuiApplication(sys.argv);app.setApplicationName('FPV-Uhyliant');app.setApplicationVersion(VERSION);harness.mark('qgui-application-complete')"
          if old not in s:
              raise SystemExit('startup message-handler pattern not found')
          s = s.replace(old, new)
          old = "hardware_e2e=HardwareE2ERuntime(d,diag,credentials);harness.mark('application-objects-complete')"
          new = "hardware_e2e=HardwareE2ERuntime(d,diag,credentials);app._runtime_refs=(e,s,d,video,v,secondary,streams,fw,acquisition,fwexec,fwsession,credentials,presets,presetexec,links,backup,pairing,telemetry,vehicle,u,diag_events,diag,hardware_e2e,m,msp,crsf,msp_serial,crsf_serial);harness.mark('application-objects-complete')"
          if old not in s:
              raise SystemExit('runtime lifetime pattern not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          t = Path('src/app/test_windows_qml_startup_crash_policy.py')
          t.write_text('''from pathlib import Path\n\n\ndef test_full_startup_does_not_install_python_qt_message_handler():\n    source = Path(__file__).with_name("main.py").read_text(encoding="utf-8")\n    assert "qInstallMessageHandler" not in source\n\n\ndef test_full_startup_keeps_qml_backends_alive():\n    source = Path(__file__).with_name("main.py").read_text(encoding="utf-8")\n    assert "app._runtime_refs=" in source\n    assert "hardware_e2e" in source.split("app._runtime_refs=", 1)[1]\n''', encoding='utf-8')
      - name: Run focused tests
        run: python -m pytest -q src/app/test_windows_qml_startup_crash_policy.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/main.py src/app/test_windows_qml_startup_crash_policy.py
          git commit -m "Fix Windows QML startup null callback crash"
          git push
